schema_version: 1

context:
  name: jupyterlab-js
  version: "4.6.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: f447e5b31886ff459927471733dfafa4f5f3abe2191173da59e7cbfed2039274

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - hatchling
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - jupyterlab_js
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: A Python package distributing JupyterLab's static assets
  homepage: https://github.com/davidbrochart/jupyterlab-js
  repository: https://github.com/davidbrochart/jupyterlab-js

extra:
  recipe-maintainers:
    - davidbrochart
